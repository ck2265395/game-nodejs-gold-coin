<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接金币</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
  <script src="./payment.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">我的第一个小游戏</p>
    <h1>接金币</h1>
    <p class="intro">按住 ← →、A、D 或下方按钮，让篮子左右移动。</p>
    <button id="play" type="button">开始游戏</button>
    <p id="status" role="status">准备好后点击开始游戏。</p>
    <p class="score">关卡：<span id="level">1</span> · 得分：<span id="score">0</span> · 剩余生命：<span id="lives">3</span></p>
    <section id="game-over" role="status" aria-live="polite" hidden>
      <h2>游戏结束</h2>
      <p>最终得分：<span id="final-score">0</span></p>
      <button id="restart" type="button">重新开始</button>
      <button id="revive" type="button" hidden>微信支付 0.01 元续命</button>
    </section>
    <section id="pay-panel" aria-labelledby="pay-title" hidden>
      <h2 id="pay-title">微信扫码续命 · 0.01 元</h2>
      <p>支付后恢复 1 条生命，保留当前分数和关卡。电脑显示二维码，用手机微信扫描。</p>
      <img id="pay-qr" width="256" height="256" alt="微信支付二维码" hidden>
      <p id="pay-message" role="status" aria-live="polite"></p>
      <button id="pay-check" type="button">检查支付结果</button>
      <button id="pay-redeem" type="button" hidden>领取续命</button>
      <button id="pay-cancel" type="button">关闭未付款订单</button>
      <button id="pay-close" type="button">收起</button>
    </section>
    <div class="game-frame">
      <canvas id="game" width="480" height="640" aria-label="接金币游戏区域：下落金币、背景、地面和底部篮子">你的浏览器不支持 Canvas，请使用现代浏览器。</canvas>
    </div>
    <div class="movement-controls" role="group" aria-label="篮子移动控制">
      <button id="move-left" type="button" aria-label="向左移动">← 向左</button>
      <button id="move-right" type="button" aria-label="向右移动">向右 →</button>
    </div>
    <p id="game-error" role="alert" hidden></p>
    <p class="hint">电脑可用键盘，手机可按住下方左右按钮。松开停止，篮子不会超出画布。接住金币加 1 分，漏接扣 1 条生命。每接住 10 枚金币升一级，金币掉落更密集、更快。初始有 3 条生命，耗尽后可重新开始。</p>
    <noscript>请启用 JavaScript 以显示游戏画面。</noscript>
  </main>
</body>
</html>
